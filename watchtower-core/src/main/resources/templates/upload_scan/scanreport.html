<span data-nav-active="/uploadscan/results" hidden></span>
<!-- The same header as the pull request report (UAT walkthrough, 2026-10-16): title with the
     status chip, one row of fact chips, the Scanners row, then the findings. -->
<div class="wt-home-head wt-report-head">
	<div th:replace="~{fragments/pageheader :: header(${result.getName()}, 'Upload scan')}"></div>
	<span class="wt-mini-chip wt-meta-chip wt-report-head__status" tabindex="0" th:if="${result.statusPresentation != null}"
		th:classappend="${' wt-tone-' + result.statusPresentation.tone}"
		th:attr="data-tip=${result.statusPresentation.accessibleText}" th:aria-label="${result.statusPresentation.label + '. ' + result.statusPresentation.accessibleText}"><span
		class="material-icons" aria-hidden="true" th:text="${result.statusPresentation.icon}"></span><span th:text="${result.statusPresentation.label}"></span></span>
</div>
<div class="wt-meta-chips mb-3" aria-label="Scan summary">
	<span class="wt-mini-chip wt-meta-chip" tabindex="0" data-tip="Uploaded by" th:if="${!#strings.isEmpty(result.getSubmittedBy())}"
		th:aria-label="${'Uploaded by ' + result.getSubmittedBy()}"><span class="material-icons" aria-hidden="true">person</span><span
		th:text="${result.getSubmittedBy()}"></span></span>
	<span class="wt-mini-chip wt-meta-chip" tabindex="0" data-tip="Ruleset used" th:aria-label="${'Ruleset ' + result.getRuleset()}"><span
		class="material-icons" aria-hidden="true">rule</span><span th:text="${result.getRuleset()}"></span></span>
	<span class="wt-mini-chip wt-meta-chip" tabindex="0" data-tip="Submitted" th:if="${result.getSubmitDateMillis() > 0}"><span
		class="material-icons" aria-hidden="true">schedule</span><span class="localizetime" data-time-style="short" th:text="${result.getSubmitDateMillis()}"></span></span>
	<span class="wt-mini-chip wt-meta-chip" tabindex="0" data-tip="Total time from submission to finish" th:if="${result.getEndDateMillis() > 0}"><span
		class="material-icons" aria-hidden="true">timer</span><span th:text="${result.durationText}"></span></span>
	<button type="button" class="wt-mini-chip wt-meta-chip wt-copy-chip" th:if="${!#strings.isEmpty(result.getTicket())}" th:attr="data-copy-text=${result.getTicket()},
			data-tip=${'Ticket ' + result.getTicket() + '. Click to copy.'}" th:aria-label="${'Copy ticket ' + result.getTicket()}"><span
		class="material-icons" aria-hidden="true">confirmation_number</span><span class="wt-mono"
		th:text="${#strings.length(result.getTicket()) > 8 ? #strings.substring(result.getTicket(), 0, 8) + '…' : result.getTicket()}"></span><span
		class="material-icons" aria-hidden="true">content_copy</span></button>
</div>

<!-- Failed: one error card in plain words, the raw message folded away, and a way to retry. -->
<section th:if="${result.failure != null}" class="wt-failure-card mb-4" role="alert" th:with="failure=${result.failure}">
	<span class="material-icons" aria-hidden="true">folder_off</span>
	<div>
		<strong th:text="${failure.headline()}">Couldn't read the archive</strong>
		<p class="mb-2" th:text="${failure.hint()}">Re-create the ZIP and upload it again.</p>
		<details class="mb-2"><summary>Technical detail</summary><pre class="wt-mono wt-failure-card__detail" th:text="${failure.detail()}"></pre></details>
		<a sec:authorize="hasAuthority('Scan Submit')" class="btn btn-secondary btn-sm" href="/uploadscan"><span class="material-icons" aria-hidden="true">upload_file</span>Upload again</a>
	</div>
</section>

<th:block th:if="${result.failure == null}">
	<section class="wt-scan-strip mb-3" aria-label="Scanners">
		<div th:replace="~{fragments/scanstrip :: scanners(${result.scannerTiles}, ${result.executionSummary})}"></div>
	</section>
	<div th:replace="~{fragments/findings :: workspace('Findings', ${findings}, false, false)}"></div>
	<div th:replace="~{fragments/feedback :: dialog('upload', ${feedbackScanId})}"></div>
</th:block>
