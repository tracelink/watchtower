<div th:replace="~{fragments/pageheader :: header('New upload scan', null)}"></div>

<!-- docs/design-system.md, "Restraint": the scanner's state is one chip line, and the admin
     controls sit behind one button on it, instead of a second card beside the form. -->
<div class="wt-page-bar mb-3" aria-label="Scanner state">
  <p class="wt-page-meta wt-meta-chips m-0">
    <span th:replace="~{fragments/scannerstate :: chips(${scanStatePaused}, ${scanStateQuiesced}, ${numScansQueued}, ${numScansInProgress})}"></span>
  </p>
  <details class="wt-admin-disclosure wt-popover" th:if="${#authorization.expression('hasAuthority('''+T(com.tracelink.appsec.watchtower.core.auth.model.CorePrivilege).SCAN_ADMIN_NAME+''')')}">
    <summary><span class="material-icons" aria-hidden="true">tune</span>Scanner controls</summary>
    <div class="wt-popover__body wt-scanner-controls">
      <strong>Affects every upload scan</strong>
      <form method="POST" action="/uploadscan/pause"
          th:data-confirm="${scanStatePaused} ? 'Resume the upload scanner? Queued scans start again.' : 'Pause the upload scanner? Uploads are still accepted, but queued scans stop starting.'"
          th:data-confirm-action="${scanStatePaused} ? 'Resume' : 'Pause'">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <input type="hidden" name="pause" th:value="${!scanStatePaused}">
        <md-outlined-button type="submit" th:text="${scanStatePaused} ? 'Resume scanner' : 'Pause scanner'">Pause scanner</md-outlined-button>
      </form>
      <form method="POST" action="/uploadscan/quiesce"
          th:data-confirm="${scanStateQuiesced} ? 'Accept new uploads again?' : 'Quiesce the upload scanner? Queued work finishes and new uploads are rejected.'"
          th:data-confirm-action="${scanStateQuiesced} ? 'Accept uploads' : 'Quiesce'">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <input type="hidden" name="quiesce" th:value="${!scanStateQuiesced}">
        <md-outlined-button type="submit" th:text="${scanStateQuiesced} ? 'Resume accepting scans' : 'Quiesce scanner'">Quiesce scanner</md-outlined-button>
      </form>
    </div>
  </details>
</div>

<!-- Drop zone on the left, ruleset and Start scan on the right, so the form spans the page. -->
<section class="card card-small wt-submission-form wt-upload-form mb-4" aria-label="Submit an upload scan">
  <div class="card-body">
    <form method="POST" action="/uploadscan" enctype="multipart/form-data" class="wt-md-form wt-upload-form__grid" data-scan-submission>
      <label class="wt-drop-zone" for="uploadControl">
        <span class="material-icons" aria-hidden="true">upload_file</span>
        <span class="wt-drop-zone__title">Drop a ZIP here or choose a file</span>
        <span class="wt-meta-chips wt-drop-zone__limits">
          <span class="wt-mini-chip" tabindex="0" data-tip="Only .zip archives are accepted."><span
              class="material-icons" aria-hidden="true">folder_zip</span>ZIP only</span>
          <span class="wt-mini-chip" tabindex="0" th:if="${uploadLimitShort != null}" th:attr="data-tip=${uploadLimit}"><span
              class="material-icons" aria-hidden="true">straighten</span><span th:text="${uploadLimitShort}">Up to 250 MB</span></span>
        </span>
        <!-- The exact limits, for screen readers; sighted people hover the size chip. -->
        <span id="upload-help" class="visually-hidden" th:text="${uploadLimit}">ZIP only; the server's upload limit applies.</span>
        <!-- The chosen file shows as a chip (with a remove button) instead of the browser's own file bar;
             the real input is an invisible overlay, so clicking or dropping on the zone still works. -->
        <span class="wt-mini-chip wt-mini-chip--ok wt-drop-zone__file" data-upload-file-chip hidden><span
            class="material-icons" aria-hidden="true">folder_zip</span><span data-upload-file-name></span><button
            type="button" class="wt-drop-zone__clear" aria-label="Remove the chosen file" data-tip="Remove file" data-upload-file-clear><span
            class="material-icons" aria-hidden="true">close</span></button></span>
        <input type="file" class="wt-drop-zone__input" id="uploadControl" name="uploadFile" accept=".zip,application/zip" required aria-describedby="upload-help" data-upload-file>
      </label>
      <div class="wt-upload-form__side">
        <md-outlined-select label="Ruleset" name="ruleset" required>
          <md-select-option th:each="ruleset : ${rulesets}" th:value="${ruleset.getName()}" th:selected="${defaultRuleset!=null && ruleset.getName().equals(defaultRuleset.getName())}">
            <div slot="headline" th:text="${ruleset.getName()}"></div>
          </md-select-option>
        </md-outlined-select>
        <span class="wt-meta-chips" th:if="${scannerModules != null and !scannerModules.empty}"
            th:with="ready=${scannerModules.?[state == 'ready']}, off=${scannerModules.?[state == 'off']}, setup=${scannerModules.?[state == 'setup']}">
          <span class="wt-mini-chip" tabindex="0" th:classappend="${ready.empty} ? ' wt-tone-warning' : ''"
              th:attr="data-tip=${'Ready: ' + (ready.empty ? 'none' : #strings.listJoin(ready.![name], ', '))
                  + (off.empty ? '' : '. Off: ' + #strings.listJoin(off.![name], ', '))
                  + (setup.empty ? '' : '. Needs setup: ' + #strings.listJoin(setup.![name], ', ')) + '.'}"><span
              class="material-icons" aria-hidden="true">verified</span><span th:text="${ready.size() + (ready.size() == 1 ? ' scanner ready' : ' scanners ready')}">7 scanners ready</span></span>
        </span>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <div class="wt-form-actions">
          <md-filled-button type="submit" data-submit-button><span slot="icon" class="material-icons" aria-hidden="true">play_arrow</span>Start scan</md-filled-button>
          <span class="wt-submit-status" role="status" aria-live="polite" aria-atomic="true"></span>
        </div>
      </div>
    </form>
  </div>
</section>

<section class="card card-small wt-recent-scans" aria-labelledby="upload-recent-heading" data-recent-scan-list>
  <div class="card-header border-bottom wt-section-heading">
    <h2 id="upload-recent-heading" class="h5 m-0">Recent upload scans</h2>
    <a class="wt-entity-link" href="/uploadscan/results">View all results</a>
  </div>
  <div class="card-body">
    <p class="wt-inline-state" th:if="${recentActivity.empty}">No upload scans have been submitted yet.</p>
    <div class="wt-table-scroll" role="region" aria-label="Recent upload scans" tabindex="0" th:unless="${recentActivity.empty}">
      <div th:replace="~{fragments/scanactivity :: table(${recentActivity}, 'Five most recently submitted upload scans')}"></div>
    </div>
  </div>
</section>
