<div th:replace="~{fragments/pageheader :: header('Pull request results', null)}"></div>
<!-- The last 90 days by default: the page reads an indexed window, not every scan ever run.
     Older ones are one click away; nothing is moved or deleted. -->
<div class="wt-page-bar mb-3">
  <div th:replace="~{fragments/resultfilters :: filters(baseUrl=${'/scan/results/'}, filters=${filters}, activeFilter=${activeFilter})}"></div>
  <div class="wt-result-period" th:if="${periods != null}">
    <nav class="wt-segmented-filter" aria-label="Period" data-result-period>
      <a th:each="p : ${periods}" th:href="@{/scan/results/{f}(f=${activeFilter},period=${p.key})}"
         th:class="${p == period} ? 'wt-segment is-active' : 'wt-segment'"
         th:attr="aria-current=${p == period ? 'page' : null}" th:text="${p.display}">Last 90 days</a>
    </nav>
  </div>
</div>
<th:block th:if="${results != null and #lists.isEmpty(results)}"><div th:replace="~{fragments/emptystate :: state(${period != null and period.name() == 'RECENT' ? 'No pull request scans match this filter in the last 90 days. Older ones are under Older.' : 'No pull request scans match this filter.'})}"></div></th:block>
<div class="row" th:if="${results != null and !#lists.isEmpty(results)}">
	<div class="col"><div id="results-region" class="card card-small mb-2">
		<div th:replace="~{fragments/pagination(baseUrl=${'/scan/results/' + activeFilter + (filterQuery ?: '')}, pagination=${pagination})}"></div>
		<div class="card-body pb-3 wt-table-scroll" role="region" aria-label="Pull request scan results" tabindex="0">
            <div th:replace="~{fragments/scanactivity :: table(${activityRows}, 'Pull request scans matching the selected filter, newest first')}"></div>
		</div>
	</div></div>
</div>
