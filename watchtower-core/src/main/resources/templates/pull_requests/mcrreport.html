<span data-nav-active="/scan/mcr" hidden></span>
<th:block th:with="canModify=${#authorization.expression('hasAuthority('''+T(com.tracelink.appsec.watchtower.core.auth.model.CorePrivilege).SCAN_MCR_MODIFY_NAME+''')')}">
<!-- The PR scan report's header (mockup "MCR report", approved 2026-10-27): the review status as a chip
     by the title, meaning on hover; reviewers change it from one button that opens a small dialog; the
     facts as icon chips. No cards above the findings (docs/design-system.md, "Restraint"). -->
<div class="wt-home-head wt-report-head">
	<div th:replace="~{fragments/pageheader :: header(${result.getDisplayName()}, 'Manual code review')}"></div>
	<span class="wt-mini-chip wt-meta-chip wt-report-head__status" tabindex="0" th:if="${currentMcrStatus != null}"
		th:classappend="${' wt-tone-' + currentMcrStatus.tone}" th:attr="data-tip=${currentMcrStatus.meaning}"
		th:aria-label="${currentMcrStatus.displayName + '. ' + currentMcrStatus.meaning}"><span
		class="material-icons" aria-hidden="true" th:text="${currentMcrStatus.icon}"></span><span th:text="${currentMcrStatus.displayName}"></span></span>
	<div class="wt-report-status" th:if="${canModify}">
		<md-outlined-button class="wt-row-action" type="button" has-icon data-wt-dialog-open="#mcrStatusDialog">
			<span slot="icon" class="material-icons" aria-hidden="true">edit</span>Update status</md-outlined-button>
	</div>
</div>
<div class="wt-meta-chips mb-3">
	<a class="wt-mini-chip wt-mini-chip--link wt-meta-chip" th:href="${result.getPrLink()}" target="_blank" rel="noopener noreferrer"><span
		class="material-icons" aria-hidden="true">open_in_new</span>View pull request</a>
	<a class="wt-mini-chip wt-mini-chip--link wt-meta-chip" th:href="${'/scan/report/' + result.getId()}"
		th:attr="data-tip=${'The pull request scan, with its ' + result.findingCount + (result.findingCount == 1 ? ' scanner finding' : ' scanner findings')}"><span
		class="material-icons" aria-hidden="true">bug_report</span><span th:text="${'Scan · ' + result.findingCount + (result.findingCount == 1 ? ' finding' : ' findings')}"></span></a>
	<span class="wt-mini-chip wt-meta-chip" tabindex="0" data-tip="Author" th:aria-label="${'Author ' + result.getAuthor()}"><span
		class="material-icons" aria-hidden="true">person</span><span th:text="${result.getAuthor()}"></span></span>
	<span class="wt-mini-chip wt-meta-chip" tabindex="0" data-tip="Integration" th:aria-label="${'Integration ' + result.getApiLabel()}"><span
		class="material-icons" aria-hidden="true">call_merge</span><span th:text="${result.getApiLabel()}"></span></span>
	<span class="wt-mini-chip wt-meta-chip" tabindex="0" data-tip="Scanned" th:if="${result.getDateMillis() > 0}"><span
		class="material-icons" aria-hidden="true">schedule</span><span class="localizetime" data-time-style="short" th:attr="data-millis=${result.getDateMillis()}"
		th:text="${result.getDateMillis()}"></span></span>
	<span class="wt-mini-chip wt-meta-chip" th:unless="${result.getDateMillis() > 0}"><span class="material-icons" aria-hidden="true">schedule</span>Not completed</span>
	<span class="wt-mini-chip wt-meta-chip" tabindex="0" data-tip="Code for a person to review. These matches are separate from scanner findings."
		th:aria-label="${result.mcrCount + (result.mcrCount == 1 ? ' manual code review match' : ' manual code review matches') + ', separate from scanner findings'}"><span
		class="material-icons" aria-hidden="true">rate_review</span><span th:text="${result.mcrCount + (result.mcrCount == 1 ? ' MCR match' : ' MCR matches')}"></span></span>
</div>

<!-- Findings. The code that backs these lives in the #wt-code-section below, not in this
     table: an MCR pass with many findings used to render many snippets inside these rows,
     and the same file once per finding in it. -->
<div th:replace="~{fragments/findings :: workspace('MCR Findings', ${findings}, false, true)}"></div>

<!-- Code, once per file that has an MCR finding - never for a clean file, because
     PRScanResultService only ever builds an entry for a file a finding landed in. -->
<div th:replace="~{fragments/findings :: code(${result.getMcrCodeFiles()})}"></div>

<!-- The review status form, in a dialog like the PR report's bypass. -->
<md-dialog id="mcrStatusDialog" th:if="${canModify}">
	<div slot="headline" class="wt-dialog-headline"><span>Review status</span>
		<button type="button" class="wt-icon-action" data-wt-dialog-close aria-label="Close"><span class="material-icons" aria-hidden="true">close</span></button></div>
	<form slot="content" id="mcrStatusForm" class="wt-md-form" data-mcr-status method="POST"
		th:action="@{/scan/mcr/report/{id}/setstatus (id=${result.getId()})}">
		<md-outlined-select name="mcrstatus" label="Review status">
			<md-select-option th:each="status : ${mcrStatuses}" th:value="${status}"
				th:selected="${#strings.equals(status, currentMcrStatus)}">
				<div slot="headline" th:text="${status.getDisplayName}"></div>
			</md-select-option>
		</md-outlined-select>
	</form>
	<div slot="actions">
		<md-text-button type="button" data-wt-dialog-close>Cancel</md-text-button>
		<md-filled-button type="submit" form="mcrStatusForm" has-icon><span slot="icon" class="material-icons" aria-hidden="true">save</span>Save</md-filled-button>
	</div>
</md-dialog>
</th:block>
