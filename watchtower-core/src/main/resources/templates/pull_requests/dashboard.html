<span hidden data-assistant-kind="metrics" data-assistant-scan-type="pull_request"></span>
<div th:replace="~{fragments/pageheader :: header('Pull request dashboard', null)}"></div>
<!-- The charts come first. All-time counts are one muted line, not tiles: scans, findings and
     duration are already shown for the selected period (docs/design-system.md, "Restraint"). -->
<p class="wt-meta-chips mb-3" data-dashboard-totals>
  <span class="wt-mini-chip wt-meta-chip" tabindex="0" data-tip="Pull requests Watchtower has seen. Each can be scanned many times, once per new commit."><span
    class="material-icons" aria-hidden="true">compare_arrows</span><strong th:text="${#numbers.formatInteger(numPrs, 1, 'COMMA')}">0</strong> pull requests</span>
  <span class="wt-mini-chip wt-meta-chip" tabindex="0" data-tip="Repositories those pull requests belong to."><span
    class="material-icons" aria-hidden="true">code</span><strong th:text="${#numbers.formatInteger(numRepos, 1, 'COMMA')}">0</strong> repositories</span>
  <span th:replace="~{fragments/scanworkload :: chip}"></span>
</p>
<div th:replace="~{fragments/dashboard :: insights('Top rules', true)}"></div>
<div class="mt-4" th:insert="~{fragments/scanworkload :: workload}"></div>
<div th:replace="~{fragments/dashboard :: recentScans('pull request', '/scan/results')}"></div>
