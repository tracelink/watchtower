<div th:replace="~{fragments/pageheader :: header(${user.username}, 'User')}"></div>
<!-- The username is the title; the page is one small form (docs/design-system.md, "Restraint"). -->
<form method="POST" action="/usermgmt/edit" class="card card-small mb-4">
  <div class="card-body wt-md-form">
    <label class="wt-checkbox-label">
      <md-checkbox aria-label="Account enabled" th:checked="${user.enabled == 1}" id="enabled" value="1" name="enabled"></md-checkbox>
      Enabled
    </label>
    <fieldset>
      <legend class="h6">Roles</legend>
      <p class="wt-page-meta">Select every role this account should hold. Clearing all roles removes all role permissions.</p>
      <input type="hidden" name="rolesSubmitted" value="true"/>
      <label class="wt-checkbox-label" th:each="role : ${roles}">
        <md-checkbox name="roleIds" th:value="${role.id}" th:checked="${selectedRoleIds.contains(role.id)}"
                     th:attr="aria-label=${role.roleName}"></md-checkbox>
        <span th:text="${role.roleName}"></span>
      </label>
    </fieldset>
  </div>
  <div class="card-footer">
    <input type="hidden" name="id" th:value="${user.id}"/>
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <md-filled-button type="submit">Save</md-filled-button>
  </div>
</form>
