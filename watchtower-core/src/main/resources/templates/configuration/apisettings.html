<!-- Integrations (UAT walkthrough, 2026-10-16): one "Add integration" menu by the title; each row
     shows the provider icon, the connection and webhook states as chips with their meaning (and
     the check time) on hover, and Test and Delete as icon buttons. Delete confirms in #deleteModal (deleteintegration.html). -->
<th:block th:with="canModify=${#authorization.expression('hasAuthority('''+T(com.tracelink.appsec.watchtower.core.auth.model.CorePrivilege).API_SETTINGS_MODIFY_NAME+''')')}">
<div class="wt-home-head">
  <div th:replace="~{fragments/pageheader :: header('Integrations', null)}"></div>
  <details class="wt-popover wt-download-menu wt-report-head__status" th:if="${canModify}" data-add-integration>
    <summary class="btn btn-primary btn-sm"><span class="material-icons" aria-hidden="true">add</span>Add integration<span
        class="material-icons" aria-hidden="true">arrow_drop_down</span></summary>
    <div class="wt-popover__body wt-download-menu__body">
      <a th:each="apiTypeName : ${apiTypeNames}" class="wt-menu-item"
          th:href="@{/apisettings/create(apiType=${apiTypeName})}"><span class="material-icons wt-accent-icon" aria-hidden="true"
          th:text="${apiTypeName == 'Amazon ECR' ? 'inventory_2' : 'code'}">code</span><th:block th:text="${apiTypeName}">Bitbucket Cloud</th:block></a>
    </div>
  </details>
</div>

<th:block th:unless="${hasApiSettings}">
  <div th:replace="~{fragments/emptystate :: state('No API integrations configured')}"></div>
</th:block>
<div th:if="${hasApiSettings}" class="card card-small mb-4">
  <div class="wt-table-scroll" tabindex="0" role="region" aria-label="Configured API integrations">
    <table class="table mb-0">
      <caption class="visually-hidden">Configured API integrations, connection and webhook state, and actions</caption>
      <thead><tr>
        <th scope="col">Integration</th><th scope="col">Connection</th><th scope="col">Webhook</th>
        <th scope="col"><span class="visually-hidden">Actions</span></th>
      </tr></thead>
      <tbody><tr th:each="api : ${apiSettings}"
          th:with="conn=${T(com.tracelink.appsec.watchtower.core.scan.apiintegration.IntegrationPresentation).connection(api, failing.contains(api.apiLabel))},
              failureDetail=${T(com.tracelink.appsec.watchtower.core.scan.apiintegration.IntegrationPresentation).failureDetail(api)}, hook=${T(com.tracelink.appsec.watchtower.core.scan.apiintegration.IntegrationPresentation).webhook(api)}">
        <th scope="row">
          <span class="wt-integration-name">
            <span class="wt-scanner-tile wt-scanner-tile--ran" aria-hidden="true"><span class="material-icons"
                th:text="${T(com.tracelink.appsec.watchtower.core.scan.apiintegration.IntegrationPresentation).icon(api)}">code</span></span>
            <span class="wt-integration-name__text">
              <a th:if="${canModify}" class="wt-entity-link"
                  th:href="@{/apisettings/configure(apiLabel=${api.apiLabel})}" th:text="${api.apiLabel}">Integration</a>
              <span th:unless="${canModify}" th:text="${api.apiLabel}">Integration</span>
              <small class="text-muted" th:text="${api.apiType.getTypeName()}">Bitbucket Cloud</small>
            </span>
          </span>
        </th>
        <!-- The last connection check (Test, a repository sync, or the 6-hourly check): a chip, with
             why it failed and when on hover. A check just run here is announced. -->
        <td data-connection-result role="status" aria-live="polite"
            th:with="justChecked=${connectionCheckLabel != null and connectionCheckLabel == api.apiLabel}">
          <span class="wt-status-chip" tabindex="0" data-connection-chip th:classappend="${' wt-tone-' + conn.tone}"
              th:attr="data-tip=${conn.tip},data-tip-millis=${conn.tipMillis}"><span class="material-icons" aria-hidden="true"
              th:text="${conn.icon}">check_circle</span><span th:text="${conn.label}">Connected</span></span>
          <!-- The provider's raw error (with its request ID) stays one click away, not on the chip. -->
          <details th:if="${failureDetail != null}" class="wt-popover" data-connection-detail>
            <summary class="wt-mini-chip wt-mini-chip--link" aria-label="Details of the failed check"><span
                class="material-icons" aria-hidden="true">info</span>Details</summary>
            <div class="wt-popover__body" th:text="${failureDetail}">Status Code: 403</div>
          </details>
          <span th:if="${justChecked}" class="visually-hidden" th:text="${connectionCheckMessage}"></span>
        </td>
        <td>
          <span th:if="${hook != null}" class="wt-status-chip" tabindex="0" data-webhook-chip
              th:classappend="${' wt-tone-' + hook.tone}" th:attr="data-tip=${hook.tip}"><span class="material-icons"
              aria-hidden="true" th:text="${hook.icon}">webhook</span><span th:text="${hook.label}">Not set up</span></span>
          <span th:if="${hook == null}" class="text-muted">—</span>
          <a th:if="${api.apiType.name() == 'BITBUCKET_CLOUD'}" class="wt-mini-chip wt-mini-chip--link"
              th:href="@{/apisettings/{label}/webhooks/manage(label=${api.apiLabel})}" aria-label="View workspace and repository webhooks">View hooks</a>
        </td>
        <td><div class="wt-table-actions">
          <form method="post" action="/apisettings/testConnection">
            <input type="hidden" name="apiLabel" th:value="${api.apiLabel}"/>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="wt-icon-action" data-tip="Test connection"
                th:attr="aria-label=${'Test connection of ' + api.apiLabel}"><span class="material-icons"
                aria-hidden="true">sync</span></button>
          </form>
          <button type="button" class="wt-icon-action wt-icon-action--danger" data-tip="Delete integration"
              data-wt-dialog-target="#deleteModal" th:if="${canModify}"
              th:attr="data-label=${api.apiLabel},data-provider=${api.apiType.getTypeName()},data-repo-count=${repositoryCounts.getOrDefault(api.apiLabel, 0L)},data-repo-name=${onlyRepositories.get(api.apiLabel)},aria-label=${'Delete ' + api.apiLabel}"><span
              class="material-icons" aria-hidden="true">delete</span></button>
        </div></td>
      </tr></tbody>
    </table>
  </div>
  <div th:replace="~{fragments/pagination(baseUrl=${'/apisettings'}, pagination=${pagination})}"></div>
</div>

<th:block th:if="${canModify}"><md-dialog th:replace="~{configuration/deleteintegration :: dialog}"></md-dialog></th:block>
</th:block>
