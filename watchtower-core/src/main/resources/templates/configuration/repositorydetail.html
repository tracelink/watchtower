
<!-- One repository (docs/design-system.md, "Restraint"; Fixes board 2026-10-22): its name, status
     chip and actions on one line (icons with hover text, Scan the one filled button), its facts as
     chips, then its scans in tabs with counts. Changes happen in the same edit dialog as the
     inventory's. -->
<div id="results-region" data-repo-scan
    th:with="repo=${row.repo},
             live=${row.status.name() != 'GONE' and row.status.name() != 'ORPHANED'},
             canModify=${#authorization.expression('hasAuthority(''Repository Settings Modify'')')},
             canIntake=${isCode and live and #authorization.expression('hasAuthority(''Rule Modify'') and hasAuthority(''Assistant Source Read'') and hasAuthority(''Repository Settings View'') and hasAuthority(''Scan Results View'')')},
             canScan=${isCode and #authorization.expression('hasAuthority(''Scan Submit'')')}">
<div class="wt-home-head wt-report-head wt-repo-head mb-3">
  <div th:replace="~{fragments/pageheader :: header(${repo.repoName}, ${repo.apiLabel})}"></div>
  <div class="wt-meta-chips">
    <details class="wt-popover">
      <summary th:aria-label="${row.status.labelFor(!isCode) + '. Why?'}"><span class="wt-status-chip" data-repository-status
          th:classappend="${' wt-tone-' + row.status.tone}" th:text="${row.status.labelFor(!isCode)}">Active</span></summary>
      <div class="wt-popover__body" th:text="${row.reason}">Last pull request scanned 2 d ago.</div>
    </details>
    <span th:if="${repo.criticality < 3}" class="wt-status-chip wt-status-chip--warning"
        th:text="${T(com.tracelink.appsec.watchtower.core.scan.repository.RepoCriticality).of(repo.criticality).displayName}">Critical</span>
    <span th:each="l : ${repo.labels}" class="wt-status-chip wt-tone-neutral" th:text="${l}">pci</span>
  </div>
  <div class="wt-page-actions">
    <button th:if="${#authorization.expression('hasAuthority(''Assistant Use'')')}" type="button" class="wt-icon-action wt-icon-action--ai" data-assistant-open
        th:attr="data-assistant-kind='repository',data-assistant-repo-id=${repo.id},data-assistant-subject=${repo.repoName},data-assistant-context=${'Help with the ruleset assignment for repository ID ' + repo.id + '. Keep this exact repository scope and prepare any requested change set for review.'}"
        aria-label="Ask the assistant about this repository" data-tip="Ask the assistant about this repository"><span
        class="material-icons" aria-hidden="true">auto_awesome</span></button>
    <span th:if="${isCode and canModify and #authorization.expression('hasAuthority(''Assistant Use'')')}" class="wt-ai-anchor" data-ai-helper="onboarding" hidden>
      <button type="button" class="wt-icon-action wt-icon-action--ai" th:attr="data-repo-id=${repo.id}" aria-expanded="false"
          aria-label="Suggest a ruleset for this repository" data-tip="Suggest a ruleset: the assistant recommends one and prepares the change for you to review"><span
          class="material-icons" aria-hidden="true">rule</span></button></span>
    <button th:if="${canIntake}" type="button" class="wt-icon-action" data-missed-open
        aria-label="Record a missed vulnerability" data-tip="Record a missed vulnerability"><span
        class="material-icons" aria-hidden="true">flag</span></button>
    <th:block th:if="${canModify}">
      <button type="button" class="wt-icon-action" data-wt-dialog-target="#repoEditDialog"
          th:attr="data-edit-id=${repo.id},data-edit-name=${repo.repoName},data-edit-project=${repo.projectKey},data-edit-ruleset=${repo.ruleset == null ? -1 : repo.ruleset.id},data-edit-team=${repo.team},data-edit-owner=${repo.ownerName},data-edit-labels=${#strings.listJoin(repo.labels, ', ')},data-edit-criticality=${repo.criticality},data-edit-paused=${repo.scanningPaused}"
          aria-label="Edit" data-tip="Edit"><span class="material-icons" aria-hidden="true">edit</span></button>
      <!-- Pause and Delete are rarely used, so they sit behind one more-actions menu, not next to Edit. -->
      <details class="wt-popover wt-download-menu wt-row-menu">
        <summary class="wt-icon-action" aria-label="More actions" data-tip="More actions"><span class="material-icons" aria-hidden="true">more_vert</span></summary>
        <div class="wt-popover__body wt-download-menu__body">
          <form method="POST" th:action="@{/repository/{t}/{id}(t=${activeScanType},id=${repo.id})}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" name="toDetail" value="true"/>
            <input type="hidden" name="scanning" value="on" th:if="${repo.scanningPaused}"/>
            <button type="submit" class="wt-menu-item"><span class="material-icons" aria-hidden="true"
                th:text="${repo.scanningPaused ? 'play_arrow' : 'pause'}">pause</span> <th:block th:text="${repo.scanningPaused ? 'Resume scanning' : 'Pause scanning'}">Pause scanning</th:block></button>
          </form>
          <form method="POST" th:action="@{/repository/{t}/bulk(t=${activeScanType})}" data-confirm-action="Delete" data-confirm-title="Delete repository?"
              th:attr="data-confirm=${'Delete ' + repo.repoName + ' and its repository scan history? Pull request scans stay, and a later pull request or sync adds it back.'}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" name="action" value="delete"/>
            <input type="hidden" name="repoIds" th:value="${repo.id}"/>
            <input type="hidden" name="source" th:value="${repo.apiLabel}"/>
            <button type="submit" class="wt-menu-item wt-menu-item--danger"><span class="material-icons" aria-hidden="true">delete</span> Delete repository</button>
          </form>
        </div>
      </details>
    </th:block>
    <md-filled-button th:if="${canScan and live}" type="button" data-wt-dialog-target="#repoScanDialog"
        th:attr="data-repo-id=${repo.id},data-repo-name=${repo.repoName}" has-icon><span class="material-icons" slot="icon"
        aria-hidden="true">play_arrow</span>Scan</md-filled-button>
  </div>
</div>

<!-- Facts as one row of chips (UAT walkthrough, 2026-10-16), the AWS agent's chip beside them. -->
<div class="wt-meta-chips mb-3" aria-label="Repository facts">
  <a class="wt-mini-chip wt-mini-chip--link wt-meta-chip" th:href="${inventoryPath + '?source=' + #uris.escapeQueryParam(repo.apiLabel)}"><span
      class="material-icons" aria-hidden="true">code</span><span th:text="${repo.apiLabel + (isCode and repo.projectKey != null ? ' · ' + repo.projectKey : '')}">BitBucket · WPRT</span></a>
  <span th:if="${repo.team != null or repo.ownerName != null}" class="wt-mini-chip wt-meta-chip" tabindex="0" data-tip="Team and owner"><span
      class="material-icons" aria-hidden="true">groups</span><span th:text="${(repo.team ?: '') + (repo.team != null and repo.ownerName != null ? ' · ' : '') + (repo.ownerName ?: '')}">checkout · alice</span></span>
  <span th:if="${isCode and repo.defaultBranch != null}" class="wt-mini-chip wt-meta-chip" tabindex="0" data-tip="Default branch"><span
      class="material-icons" aria-hidden="true">alt_route</span><span th:text="${repo.defaultBranch}">main</span></span>
  <span class="wt-mini-chip wt-meta-chip" tabindex="0" data-tip="Ruleset"><span class="material-icons" aria-hidden="true">rule</span><span
      th:text="${repo.ruleset == null ? 'No ruleset' : T(com.tracelink.appsec.watchtower.core.scan.presentation.ScannerIdentity).readableRulesetName(repo.ruleset.name)}">Default</span></span>
  <span class="wt-mini-chip wt-meta-chip" tabindex="0" th:attr="data-tip=${isCode ? 'The newest pull request, open or closed' : 'Last image scan'}"><span
      class="material-icons" aria-hidden="true" th:text="${isCode} ? 'merge' : 'image'">merge</span><span th:text="${(isCode ? 'Last PR ' : 'Last scan ') + lastPr}">Last PR #58 · Open · 7 d ago</span></span>
  <th:block th:if="${isCode}">
    <span class="wt-mini-chip wt-meta-chip" tabindex="0" th:attr="data-tip=${'Last sync ' + synced}"><span class="material-icons" aria-hidden="true">commit</span><span
        th:text="${'Last commit ' + (row.lastCommit.isEmpty() ? 'unknown' : row.lastCommit)}">Last commit 6 d ago</span></span>
  </th:block>
</div>



<div data-nav-active="/repositories">
<nav class="wt-segmented-filter mb-3" aria-label="Repository history" th:if="${showHistory}" th:with="c=${historyCounts}">
  <a th:replace="~{fragments/resultstabs :: tab(${view}, 'all', 'All results', 'list', @{/repositories/{id}(id=${repo.id},view='all')}, ${c == null ? null : c.all()})}"></a>
  <a th:replace="~{fragments/resultstabs :: tab(${view}, 'pull-requests', 'Pull requests', 'merge', @{/repositories/{id}(id=${repo.id},view='pull-requests')}, ${c == null ? null : c.pullRequests()})}"></a>
  <a th:replace="~{fragments/resultstabs :: tab(${view}, 'scans', 'Full repository', 'code', @{/repositories/{id}(id=${repo.id},view='scans')}, ${c == null ? null : c.repository()})}"></a>
</nav>
<th:block th:if="${showHistory}">
  <th:block th:if="${history.isEmpty()}"><div th:replace="~{fragments/emptystate :: state('No scans match this view yet.')}"></div></th:block>
  <div class="card card-small" th:unless="${history.isEmpty()}">
    <div th:replace="~{fragments/pagination(baseUrl=${baseUrl}, pagination=${pagination})}"></div>
    <div class="card-body pb-3 wt-table-scroll" role="region" aria-label="Repository scan history" tabindex="0">
      <div th:replace="~{fragments/scanactivity :: table(${history}, 'Pull request and full-repository scans for this repository, newest first')}"></div>
    </div>
  </div>
</th:block>
</div>

<th:block th:if="${canModify}">
  <md-dialog th:replace="~{configuration/repositoryedit :: dialog(${activeScanType}, ${rulesetChoices}, ${criticalities},
      ${repo.apiLabel}, '', '', '', true)}"></md-dialog>
</th:block>
<th:block th:if="${canScan and live}">
  <md-dialog th:replace="~{repo_scan/scandialog :: dialog(${repo.apiLabel}, null, ${rulesetChoices}, ${frequencies})}"></md-dialog>
</th:block>
<th:block th:if="${canIntake}"><md-dialog th:replace="~{fragments/missedcase :: dialog(${repo})}"></md-dialog>
<md-dialog th:replace="~{fragments/missedcase :: variant}"></md-dialog></th:block>
</div>
