<!-- A stored secret (UAT walkthrough, 2026-10-16): once saved it shows as a green key "Saved" with a
     small Replace button; the field appears only after Replace (scripts/secret-field.js). The value
     is never sent to the page, and a field left blank keeps the stored one. -->
<div th:fragment="field(id, name, label, saved, help)" class="wt-secret-field" data-secret-field>
  <span class="wt-secret-field__label" th:id="${id + '-label'}" th:text="${label}">API token</span>
  <div class="wt-secret-field__saved" th:if="${saved}" data-secret-saved>
    <span class="wt-mini-chip wt-mini-chip--ok"><span class="material-icons" aria-hidden="true">key</span>Saved</span>
    <button type="button" class="btn btn-secondary btn-sm" data-secret-replace th:attr="aria-controls=${id},aria-label=${'Replace ' + label}"><span
        class="material-icons" aria-hidden="true">sync_alt</span>Replace</button>
  </div>
  <md-outlined-text-field type="password" th:id="${id}" th:name="${name}" autocomplete="new-password"
      th:label="${label}" th:hidden="${saved}" data-secret-input
      th:attr="supporting-text=${saved ? 'Blank to leave unchanged' : help}"></md-outlined-text-field>
</div>
