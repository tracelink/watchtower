<div th:replace="~{fragments/pageheader :: header('Image results', null)}"></div>
<div th:replace="~{fragments/resultfilters :: filters(baseUrl=${'/imagescan/results/'}, filters=${filters}, activeFilter=${activeFilter})}"></div>
<th:block th:if="${results != null and #lists.isEmpty(results)}"><div th:replace="~{fragments/emptystate :: state('No image scans match this filter.')}"></div></th:block>
<div class="row" th:if="${results != null and !#lists.isEmpty(results)}"><div class="col">
	<div id="results-region" class="card card-small mb-2">
		<div th:replace="~{fragments/pagination(baseUrl=${'/imagescan/results/' + activeFilter}, pagination=${pagination})}"></div>
		<div class="card-body pb-3 wt-table-scroll" role="region" aria-label="Image scan results" tabindex="0">
			<table class="table mb-0 datatable-clean wt-results-table">
				<caption>Image scans in the selected tab</caption>
				<thead class="bg-light"><tr>
					<th scope="col" class="border-0">Image</th><th scope="col" class="border-0">Status</th><th scope="col" class="border-0">Findings</th>
					<th scope="col" class="border-0 wt-result-secondary">Registry</th><th scope="col" class="border-0 wt-result-secondary">Duration</th><th scope="col" class="border-0 wt-result-secondary">Finished</th>
					<th scope="col" class="border-0"><span class="visually-hidden">Report</span></th>
				</tr></thead>
				<tbody><th:block th:each="result : ${results}">
					<tr class="wt-result-row" th:with="finished=${result.statusPresentation != null and result.statusPresentation.processingCompleted}">
						<th scope="row" class="py-1 wt-result-identity wt-scan-target"><span th:text="${result.getRepositoryName()}">Image</span><span aria-hidden="true">:</span><span th:text="${result.getTagName()}">tag</span></th>
						<td class="py-1 wt-result-status"><span class="wt-status-chip" th:replace="~{fragments/status :: chip(status=${result.statusPresentation})}">Status</span></td>
						<!-- A failed or unfinished scan has no result: "—", never a clean-looking 0. -->
						<td class="py-1 wt-result-findings"><th:block th:if="${finished}"><div th:replace="~{fragments/severity :: compactSummary(${result.getViolations()})}"></div></th:block>
							<span th:unless="${finished}" class="wt-muted" tabindex="0" data-tip="No findings: the scan did not finish."
								aria-label="No findings: the scan did not finish">—</span></td>
						<td class="py-1 wt-result-secondary"><span class="wt-mini-chip wt-meta-chip" tabindex="0" data-tip="Registry integration"
							th:aria-label="${'Registry ' + result.getApiLabel()}"><span class="material-icons" aria-hidden="true">inventory_2</span><span
							th:text="${result.getApiLabel()}">Registry</span></span></td>
						<td class="py-1 wt-result-secondary wt-num" th:text="${result.durationText}">1.03 mins</td>
						<td class="py-1 wt-result-secondary" th:data-order="${result.getEndDateMillis()}"><span th:if="${result.getEndDateMillis() > 0}" class="localizetime" data-time-style="short" th:text="${result.getEndDateMillis()}"></span><span th:unless="${result.getEndDateMillis() > 0}" class="wt-muted">Not finished</span></td>
						<td class="py-1 wt-result-action"><a class="btn btn-secondary btn-sm py-1 wt-report-link" th:href="${'/imagescan/report/' + result.getId()}" th:aria-label="${'View report for ' + result.getRepositoryName() + ':' + result.getTagName()}"><span>View report</span><span class="material-icons" aria-hidden="true">arrow_forward</span></a></td>
					</tr>
					<!-- On narrow screens the secondary columns hide and show here as chips. -->
					<tr class="wt-result-detail-row"><td colspan="7"><span class="wt-meta-chips">
						<span class="wt-mini-chip wt-meta-chip" tabindex="0" data-tip="Registry integration"><span class="material-icons" aria-hidden="true">inventory_2</span><span th:text="${result.getApiLabel()}">Registry</span></span>
						<span class="wt-mini-chip wt-meta-chip" tabindex="0" data-tip="Duration"><span class="material-icons" aria-hidden="true">timer</span><span th:text="${result.durationText}">1.03 mins</span></span>
						<span class="wt-mini-chip wt-meta-chip" th:if="${result.getEndDateMillis() > 0}"><span class="material-icons" aria-hidden="true">event</span><span class="localizetime" data-time-style="short" th:text="${result.getEndDateMillis()}"></span></span>
					</span></td></tr>
				</th:block></tbody>
			</table>
		</div>
	</div>
</div></div>
