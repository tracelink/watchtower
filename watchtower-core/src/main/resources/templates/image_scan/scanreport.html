<span data-nav-active="/imagescan/results" hidden></span>
<!-- The same header as the pull request and upload reports (UAT walkthrough, 2026-10-16): title
     with the status chip, one row of fact chips, the Scanners row, then the findings. -->
<div class="wt-home-head wt-report-head">
	<div th:replace="~{fragments/pageheader :: header(${result.getRepositoryName() + ':' + result.getTagName()}, 'Image scan')}"></div>
	<span class="wt-mini-chip wt-meta-chip wt-report-head__status" tabindex="0" th:if="${result.statusPresentation != null}"
		th:classappend="${' wt-tone-' + result.statusPresentation.tone}"
		th:attr="data-tip=${result.statusPresentation.accessibleText}" th:aria-label="${result.statusPresentation.label + '. ' + result.statusPresentation.accessibleText}"><span
		class="material-icons" aria-hidden="true" th:text="${result.statusPresentation.icon}"></span><span th:text="${result.statusPresentation.label}"></span></span>
</div>
<div class="wt-meta-chips mb-3" aria-label="Scan summary">
	<span class="wt-mini-chip wt-meta-chip" tabindex="0" data-tip="Registry integration" th:if="${!#strings.isEmpty(result.getApiLabel())}"
		th:aria-label="${'Registry ' + result.getApiLabel()}"><span class="material-icons" aria-hidden="true">inventory_2</span><span
		th:text="${result.getApiLabel()}"></span></span>
	<span class="wt-mini-chip wt-meta-chip" tabindex="0" data-tip="Submitted" th:if="${result.getSubmitDateMillis() > 0}"><span
		class="material-icons" aria-hidden="true">schedule</span><span class="localizetime" data-time-style="short" th:text="${result.getSubmitDateMillis()}"></span></span>
	<span class="wt-mini-chip wt-meta-chip" tabindex="0" data-tip="Total time from submission to finish" th:if="${result.getEndDateMillis() > 0}"><span
		class="material-icons" aria-hidden="true">timer</span><span th:text="${result.durationText}"></span></span>
</div>

<!-- Failed: one error card instead of an "Error" row among the facts. -->
<section th:if="${result.getErrorMessage() != null}" class="wt-failure-card mb-4" role="alert">
	<span class="material-icons" aria-hidden="true">error</span>
	<div>
		<strong>The scan failed</strong>
		<p class="mb-0" th:text="${result.getErrorMessage()}">Error</p>
	</div>
</section>

<section class="wt-scan-strip mb-3" aria-label="Scanners">
	<div th:replace="~{fragments/scanstrip :: scanners(${result.scannerTiles}, ${result.executionSummary})}"></div>
</section>
<div th:replace="~{fragments/findings :: workspace('Vulnerabilities', ${findings}, ${result.getErrorMessage() != null}, false)}"></div>
