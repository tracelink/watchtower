<!-- Two cards (UAT walkthrough, 2026-10-16): the sample on the left with its language as a chip and
     the syntax tree folded behind a "Syntax tree" chip; the XPath rule on the right with Run rule
     and Save rule; the matches sit under both as chips that jump to the highlighted line. -->
<div class="wt-designer-workspace" data-rule-designer>
  <div class="wt-designer-grid">
    <section class="card wt-designer-card" data-designer-editor aria-labelledby="pmd-sample-heading">
      <div class="wt-designer-card__head">
        <h2 id="pmd-sample-heading" class="h6 m-0">Sample code</h2>
        <label class="wt-chip-select"><span class="visually-hidden">Language</span>
          <select name="language" id="queryLanguage" form="runqueryform">
            <option th:each="lang : ${supportedLanguages}" th:value="${lang}" th:text="${lang}"
                th:selected="${#strings.equals(lang, language)}">Java</option>
          </select></label>
      </div>
      <textarea aria-label="Sample code to test" id="source" name="source" form="runqueryform" rows="15" cols="100"
                data-designer-input
                th:text="${sourceCode}"></textarea>
      <details class="wt-designer-tree" th:if="${error == null and ast != null}">
        <summary class="wt-mini-chip wt-meta-chip"><span class="material-icons" aria-hidden="true">account_tree</span>Syntax
          tree<span class="material-icons" aria-hidden="true">expand_more</span></summary>
        <div class="wt-designer-tree__body" tabindex="0" role="region" aria-label="Syntax tree">
          <div th:each="astNode : ${ast}">
            <span th:text="${astNode.getName()}"></span>
            <details class="wt-designer-node-attributes"
                     th:if="${astNode.getAttributes().size()>0}">
              <summary>Attributes</summary>
              <span th:each="attribute : ${astNode.getAttributes()}"
                    th:text="${attribute}"></span>
            </details>
          </div>
        </div>
      </details>
    </section>
    <section class="card wt-designer-card" data-designer-editor aria-labelledby="pmd-rule-heading">
      <div class="wt-designer-card__head">
        <h2 id="pmd-rule-heading" class="h6 m-0 wt-designer-card__title"><span
            class="wt-scanner-tile wt-scanner-tile--ran" aria-hidden="true"><span
            class="material-icons">coffee</span></span>XPath rule</h2>
        <span th:replace="~{fragments/designer :: howto(${help.get('xpath')})}"></span>
      </div>
      <textarea aria-label="XPath rule" id="xpathquery" name="query" form="runqueryform" rows="4"
                data-designer-input
                th:text="${query}"></textarea>
      <div class="wt-designer-actions">
        <form method="POST" id="runqueryform" data-designer-run-form action="/designer/pmd/query">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <md-filled-button type="submit" name="Submit" value="Submit" has-icon
              data-run-rule><span slot="icon" class="material-icons" aria-hidden="true">play_arrow</span>Run rule</md-filled-button>
        </form>
        <md-outlined-button id="openSavePmdRuleDialog" type="button" has-icon
            data-save-rule
            data-wt-dialog-target="#savePmdRuleDialog"><span slot="icon" class="material-icons"
            aria-hidden="true">save</span>Save rule</md-outlined-button>
      </div>
    </section>
  </div>
  <section th:replace="~{fragments/designer :: matches(${matches}, ${error})}"></section>
</div>

<md-dialog id="savePmdRuleDialog">
  <div slot="headline">Save PMD rule</div>
  <form slot="content" id="savePmdRuleForm" method="post" class="wt-md-form"
        action="/designer/pmd/save">
    <md-outlined-text-field label="Rule Name" name="name" id="ruleName"
        th:value="${ruleName}"></md-outlined-text-field>
    <md-outlined-text-field label="Short Message" name="message" id="ruleMessage"
        th:value="${ruleMessage}"></md-outlined-text-field>
    <md-outlined-select label="Language" name="language" id="ruleLanguage">
      <md-select-option th:each="lang : ${supportedLanguages}" th:value="${lang}">
        <div slot="headline" th:text="${lang}"></div>
      </md-select-option>
    </md-outlined-select>
    <md-outlined-select label="Priority" name="priority" id="rulePriority">
      <md-select-option th:each="priority : ${rulePriorities}"
          th:value="${priority.getPriority()}" th:selected="${priority.getPriority()==rulePriority}">
        <div slot="headline" th:text="${priority.getName()}"></div>
      </md-select-option>
    </md-outlined-select>
    <md-outlined-text-field label="Query" name="query" id="ruleQuery"></md-outlined-text-field>
    <details class="wt-form-disclosure">
      <summary>More options</summary>
      <md-outlined-text-field label="External URL" name="externalUrl" id="ruleUrl"
          th:value="${ruleExtUrl}"></md-outlined-text-field>
    </details>
    <input type="hidden" id="formSource" name="source"/>
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
  </form>
  <div slot="actions">
    <md-text-button id="cancelSavePmdRuleDialog" type="button">Cancel</md-text-button>
    <md-filled-button form="savePmdRuleForm" type="submit">Save rule</md-filled-button>
  </div>
</md-dialog>
