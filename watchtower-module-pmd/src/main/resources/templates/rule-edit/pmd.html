<!-- PMD rule details. Read-only values are text with hidden inputs carrying what the POST needs;
     a custom rule's properties sit behind a disclosure (docs/design-system.md, "Restraint"). -->
<div class="card-footer">
    <form class="wt-md-form" th:action="${'/rule/edit/pmd/edit/'+(rule.isProvided()? 'provided' : 'custom')}" method="POST" th:object="${rule}">
        <div class="wt-meta-chips" th:unless="${rule.isProvided()}">
            <span th:replace="~{fragments/rulefacts :: fact('person', ${rule.author}, 'Author')}"></span>
            <span th:replace="~{fragments/rulefacts :: fact('code', ${rule.parserLanguage}, 'Language')}"></span>
            <span th:replace="~{fragments/rulefacts :: fact('account_tree', ${rule.ruleClass != null and rule.ruleClass.endsWith('XPathRule') ? 'XPath rule' : #strings.substringAfter(rule.ruleClass, 'rule.')}, ${'Rule class: ' + rule.ruleClass})}"></span>
        </div>
        <th:block th:unless="${rule.isProvided()}">
            <input type="hidden" id="author" name="author" th:value="${rule.author}">
            <input type="hidden" id="parserLanguage" name="parserLanguage" th:value="${rule.parserLanguage}">
            <input type="hidden" id="ruleClass" name="ruleClass" th:value="${rule.ruleClass}">
        </th:block>
        <th:block th:if="${rule.isProvided()}">
            <div class="wt-meta-chips" th:if="${rule.externalUrl != null and !rule.externalUrl.isEmpty()}">
                <a th:replace="~{fragments/rulefacts :: doc(${rule.externalUrl})}"></a>
            </div>
            <p th:text="${rule.message}"></p>
            <input type="hidden" id="name" name="name" th:value="${rule.name}">
            <input type="hidden" id="message" name="message" th:value="${rule.message}">
            <input type="hidden" id="externalUrl" name="externalUrl" th:value="${rule.externalUrl}">
        </th:block>
        <md-outlined-text-field th:unless="${rule.isProvided()}" label="Name" id="name" name="name"
            th:value="${rule.name}"></md-outlined-text-field>
        <md-outlined-select th:replace="~{fragments/rulefacts :: severity(${priorities}, ${rule.priority})}"></md-outlined-select>
        <th:block th:unless="${rule.isProvided()}">
            <md-outlined-text-field label="Message" id="message" name="message"
                th:value="${rule.message}"></md-outlined-text-field>
            <md-outlined-text-field label="External URL" id="externalUrl" name="externalUrl"
                th:value="${rule.externalUrl}"></md-outlined-text-field>
            <details class="wt-form-disclosure" th:unless="${rule.properties.isEmpty()}">
                <summary th:text="${'Properties (' + rule.properties.size() + ')'}">Properties</summary>
                <th:block th:each="property, stat : ${rule.properties}">
                    <input type="hidden" th:name="|properties[${stat.index}].id|" th:value="${property.id}"/>
                    <md-outlined-text-field label="Property name" id="propertyName"
                        th:name="|properties[${stat.index}].name|"
                        th:value="${property.name}"></md-outlined-text-field>
                    <md-outlined-text-field type="textarea" rows="4" label="Property value" id="propertyValue"
                        th:name="|properties[${stat.index}].value|" th:value="${property.value}"></md-outlined-text-field>
                </th:block>
            </details>
        </th:block>
        <input type="hidden" th:name="id" th:value="${rule.id}">
        <input type="hidden" th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}"/>
        <md-filled-button type="submit" has-icon><span slot="icon" class="material-icons" aria-hidden="true">save</span>Save</md-filled-button>
    </form>
</div>
