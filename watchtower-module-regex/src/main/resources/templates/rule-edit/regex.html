<!-- Regex rule details. A provided rule only has an editable priority: its other values are text,
     with hidden inputs carrying what the POST needs (docs/design-system.md, "Restraint"). -->
<div class="card-footer">
    <form class="wt-md-form" th:action="${'/rule/edit/regex/edit/'+(rule.isProvided()?'provided':'custom')}" method="POST">
        <div class="wt-meta-chips">
            <span th:replace="~{fragments/rulefacts :: fact('person', ${rule.author}, 'Author')}"></span>
            <th:block th:if="${rule.isProvided()}">
                <span th:replace="~{fragments/rulefacts :: fact('description', ${rule.fileExtension != null and !rule.fileExtension.isEmpty() ? rule.fileExtension : 'All files'}, 'File extension')}"></span>
                <th:block th:if="${rule.externalUrl != null and !rule.externalUrl.isEmpty()}"><a th:replace="~{fragments/rulefacts :: doc(${rule.externalUrl})}"></a></th:block>
            </th:block>
        </div>
        <input type="hidden" id="author" name="author" th:value="${rule.author}">
        <th:block th:if="${rule.isProvided()}">
            <dl class="wt-metadata-grid">
                <div><dt>Pattern</dt><dd class="wt-mono" th:text="${rule.regexPattern}"></dd></div>
            </dl>
            <p id="ruleMessage" th:text="${rule.message}"></p>
            <input type="hidden" id="name" name="name" th:value="${rule.name}">
            <input type="hidden" id="fileExtension" name="fileExtension" th:value="${rule.fileExtension}">
            <input type="hidden" name="message" th:value="${rule.message}">
            <input type="hidden" id="externalUrl" name="externalUrl" th:value="${rule.externalUrl}">
            <input type="hidden" id="regexPattern" name="regexPattern" th:value="${rule.regexPattern}">
        </th:block>
        <md-outlined-text-field th:unless="${rule.isProvided()}" label="Name" id="name" name="name"
            th:value="${rule.name}"></md-outlined-text-field>
        <md-outlined-select th:replace="~{fragments/rulefacts :: severity(${priorities}, ${rule.priority})}"></md-outlined-select>
        <th:block th:unless="${rule.isProvided()}">
            <md-outlined-text-field label="File extension" id="fileExtension" name="fileExtension"
                th:value="${rule.fileExtension}" supporting-text="Blank = all files"></md-outlined-text-field>
            <md-outlined-text-field type="textarea" rows="4" label="Message" id="ruleMessage" name="message"
                th:value="${rule.message}"></md-outlined-text-field>
            <md-outlined-text-field label="External URL" id="externalUrl" name="externalUrl"
                th:value="${rule.externalUrl}"></md-outlined-text-field>
            <md-outlined-text-field type="textarea" rows="4" label="Regex pattern" id="regexPattern" name="regexPattern"
                th:value="${rule.regexPattern}"></md-outlined-text-field>
        </th:block>
        <input type="hidden" th:name="id" th:value="${rule.id}">
        <input type="hidden" th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}"/>
        <md-filled-button type="submit" has-icon><span slot="icon" class="material-icons" aria-hidden="true">save</span>Save</md-filled-button>
    </form>
</div>
