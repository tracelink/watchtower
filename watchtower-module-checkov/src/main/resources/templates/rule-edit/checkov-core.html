<!-- A provided Checkov rule: only its priority is editable. Its other values are text, with hidden
     inputs carrying what the POST validates (docs/design-system.md, "Restraint"). The definitions
     are shown, not submitted - they never bound to the form. -->
<div class="card-footer">
  <form class="wt-md-form" action="/rule/edit/checkov" method="POST" th:object="${rule}">
    <div class="wt-meta-chips">
      <span th:replace="~{fragments/rulefacts :: fact('person', ${rule.author}, 'Author')}"></span>
      <th:block th:if="${rule.externalUrl != null and !rule.externalUrl.isEmpty()}"><a th:replace="~{fragments/rulefacts :: doc(${rule.externalUrl})}"></a></th:block>
    </div>
    <p th:text="${rule.message}"></p>
    <div class="wt-table-scroll" role="region" aria-label="Checkov rule definitions" tabindex="0">
      <table class="table mb-0">
        <caption>Definitions</caption>
        <thead class="bg-light">
          <tr>
            <th scope="col" class="border-0">Type</th>
            <th scope="col" class="border-0">Entity</th>
            <th scope="col" class="border-0">IaC</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="def : ${rule.getDefinitions()}">
            <td data-checkov-definition th:text="${def.type}"></td>
            <td data-checkov-definition th:text="${def.entity}"></td>
            <td data-checkov-definition th:text="${def.iac}"></td>
          </tr>
        </tbody>
      </table>
    </div>
    <md-outlined-select th:replace="~{fragments/rulefacts :: severity(${priorities}, ${rule.priority})}"></md-outlined-select>
    <input type="hidden" id="name" name="name" th:value="${rule.name}">
    <input type="hidden" id="author" name="author" th:value="${rule.author}">
    <input type="hidden" id="externalUrl" name="externalUrl" th:value="${rule.externalUrl}">
    <input type="hidden" id="message" name="message" th:value="${rule.message}">
    <input type="hidden" th:name="id" th:value="${rule.id}">
    <input type="hidden" th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}"/>
    <md-filled-button type="submit" has-icon><span slot="icon" class="material-icons" aria-hidden="true">save</span>Save severity</md-filled-button>
  </form>
</div>
