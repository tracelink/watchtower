<!-- Two cards (UAT walkthrough, 2026-10-16): the sample on the left with its format as a chip,
     the rule on the right with Run rule and Save rule; the matches sit under both as chips that
     jump to the highlighted line (fragments/designer :: matches). -->
<div class="wt-designer-workspace" data-rule-designer>
  <div class="wt-designer-grid">
    <section class="card wt-designer-card" data-designer-editor aria-labelledby="json-sample-heading">
      <div class="wt-designer-card__head">
        <h2 id="json-sample-heading" class="h6 m-0">Sample code</h2>
        <label class="wt-chip-select"><span class="visually-hidden">Source format</span>
          <select name="sourceFormat" id="jsonSourceFormat" form="runqueryform">
            <option value="json" th:selected="${sourceFormat != 'yaml'}">JSON</option>
            <option value="yaml" th:selected="${sourceFormat == 'yaml'}">YAML</option>
          </select></label>
      </div>
      <textarea aria-label="Sample JSON or YAML to test" id="code" name="code" form="runqueryform" rows="15" cols="100"
                data-designer-input
                th:text="${code}"></textarea>
    </section>
    <section class="card wt-designer-card" data-designer-editor aria-labelledby="json-rule-heading">
      <div class="wt-designer-card__head">
        <h2 id="json-rule-heading" class="h6 m-0 wt-designer-card__title"><span
            class="wt-scanner-tile wt-scanner-tile--ran" aria-hidden="true"><span
            class="material-icons">data_object</span></span>JSON path rule</h2>
        <span th:replace="~{fragments/designer :: howto(${help.get('json')})}"></span>
      </div>
      <textarea aria-label="JSON path query" id="jsonquery" name="query" form="runqueryform" rows="4"
                data-designer-input
                th:text="${query}"></textarea>
      <div class="wt-designer-actions">
        <form method="POST" id="runqueryform" data-designer-run-form action="/designer/json/query">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <md-filled-button type="submit" name="Submit" value="Submit" has-icon
              data-run-rule><span slot="icon" class="material-icons" aria-hidden="true">play_arrow</span>Run rule</md-filled-button>
        </form>
        <md-outlined-button id="openSaveJsonRuleDialog" type="button" has-icon
            data-save-rule
            data-wt-dialog-target="#saveJsonRuleDialog"><span slot="icon" class="material-icons"
            aria-hidden="true">save</span>Save rule</md-outlined-button>
      </div>
    </section>
  </div>
  <section th:replace="~{fragments/designer :: matches(${matches}, ${error})}"></section>
</div>
<md-dialog id="saveJsonRuleDialog">
  <div slot="headline">Save JSON rule</div>
  <form slot="content" id="saveJsonRuleForm" method="post" class="wt-md-form"
        action="/designer/json/save">
    <md-outlined-text-field label="Rule Name" name="name" id="ruleName"
        th:value="${ruleName}"></md-outlined-text-field>
    <md-outlined-text-field label="Short Message" name="message" id="ruleMessage"
        th:value="${ruleMessage}"></md-outlined-text-field>
    <md-outlined-select label="Priority" name="priority" id="rulePriority">
      <md-select-option th:each="priority : ${rulePriorities}"
          th:value="${priority.getPriority()}" th:selected="${priority.getPriority()==rulePriority}">
        <div slot="headline" th:text="${priority.getName()}"></div>
      </md-select-option>
    </md-outlined-select>
    <md-outlined-text-field label="Query" name="query" id="ruleQuery"></md-outlined-text-field>
    <details class="wt-form-disclosure">
      <summary>More options</summary>
      <md-outlined-text-field label="File extension" name="fileExtension" id="ruleFileExtension"
          th:value="${ruleFileExt}" supporting-text="Use .json, .yaml or .yml; blank = all files"></md-outlined-text-field>
      <div class="wt-meta-chips" data-file-types-notice hidden
          th:attr="data-types=${#strings.listJoin(moduleFileTypes, ',')}">
        <span class="wt-mini-chip wt-mini-chip--warn" tabindex="0" data-file-types-chip data-tip=""><span
            class="material-icons" aria-hidden="true">warning</span><span data-file-types-chip-text></span></span>
        <a class="wt-mini-chip wt-mini-chip--link" href="/configuration/modules"
            sec:authorize="hasAuthority('Module Settings Modify')"><span class="material-icons" aria-hidden="true">tune</span>File types</a>
      </div>
      <md-outlined-text-field label="External URL" name="externalUrl" id="ruleUrl"
          th:value="${ruleExtUrl}"></md-outlined-text-field>
    </details>
    <input type="hidden" id="formSource" name="code"/>
    <input type="hidden" id="formSourceFormat" name="sourceFormat" th:value="${sourceFormat ?: 'json'}"/>
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
  </form>
  <div slot="actions">
    <md-text-button id="cancelSaveJsonRuleDialog" type="button">Cancel</md-text-button>
    <md-filled-button form="saveJsonRuleForm" type="submit">Save rule</md-filled-button>
  </div>
</md-dialog>
