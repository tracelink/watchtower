<!-- JSON rule details. The author is a fact (text plus the hidden input the POST needs); the rest
     is editable (docs/design-system.md, "Restraint"). -->
<div class="card-footer">
    <form class="wt-md-form" action="/rule/edit/json" method="POST">
        <div class="wt-meta-chips">
            <span th:replace="~{fragments/rulefacts :: fact('person', ${rule.author}, 'Author')}"></span>
        </div>
        <input type="hidden" id="author" name="author" th:value="${rule.author}">
        <md-outlined-text-field label="Name" id="name" name="name"
            th:value="${rule.name}"></md-outlined-text-field>
        <md-outlined-select th:replace="~{fragments/rulefacts :: severity(${priorities}, ${rule.priority})}"></md-outlined-select>
        <md-outlined-text-field label="File extension" id="fileExtension" name="fileExtension"
            th:value="${rule.fileExtension}" supporting-text="Use .json, .yaml or .yml; blank = all files. YAML documents are checked separately."></md-outlined-text-field>
        <md-outlined-text-field type="textarea" rows="4" label="Message" id="ruleMessage" name="message"
            th:value="${rule.message}"></md-outlined-text-field>
        <md-outlined-text-field label="External URL" id="externalUrl" name="externalUrl"
            th:value="${rule.externalUrl}"></md-outlined-text-field>
        <md-outlined-text-field type="textarea" rows="4" label="JSON path query" id="query" name="query"
            th:value="${rule.query}"></md-outlined-text-field>
        <input type="hidden" th:name="id" th:value="${rule.id}">
        <input type="hidden" th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}"/>
        <md-filled-button type="submit" has-icon><span slot="icon" class="material-icons" aria-hidden="true">save</span>Save</md-filled-button>
    </form>
</div>
