<!doctype html>
<html class="no-js h-100" lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/authhead}"></head>
<body class="h-100">
<!-- Material Web migration, Wave 2: .wt-auth-shell (components.css) replaces the
     .container-fluid > .row.align-items-center.min-vh-100 > .col/.col-lg-6/.col Bootstrap
     grid. .card/.card-header/.list-group markup stays Bootstrap (no Material Web equivalent
     exists for either - see IMPROVEMENT_PLAN_MATERIAL_UI.md's card-conversion correction). -->
<main class="wt-auth-shell">
    <div class="card card-small mb-4">
        <div class="card-header border-bottom" >
            <div class="align-middle m-auto">
                <img id="main-logo" class="d-inline-block align-middle mr-1 me-1" src="images/watchtowerlogo.svg" alt="Watchtower">
                <span class="align-middle auth-brand-title">Watchtower</span>
            </div>
        </div>
        <div id="login-error" th:if="${param.error != null}" class="alert alert-accent bg-danger alert-dismissible fade show mb-0" role="alert">
            <span th:replace="~{fragments/closebutton :: button('alert')}"></span>
            <span th:text="${param.error[0]}">Invalid login. Please try again.</span></div>
        <ul class="list-group list-group-flush">
            <li class="list-group-item p-3">
                <div class="row">
                    <div class="col-sm-12 col-md">
                        <h1 class="h5 d-block mb-2">Login</h1>
                        <form id="login_form" action="/login" method="post" class="wt-md-form">
                            <md-outlined-text-field label="Username" name="username" autofocus="true"
                                                     autocomplete="username" aria-label="Username"
                                                     th:value="${loginUsername}"
                                                     th:attr="aria-describedby=${hasLoginError ? 'login-error' : null},aria-invalid=${hasLoginError ? 'true' : null}"></md-outlined-text-field>
                            <md-outlined-text-field type="password" label="Password" name="password"
                                                     id="inputPassword4" autocomplete="current-password"
                                                     th:attr="aria-describedby=${hasLoginError ? 'login-error' : null},aria-invalid=${hasLoginError ? 'true' : null}"></md-outlined-text-field>
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <md-filled-button class="wt-btn-block" style="margin-top: var(--wt-space-4)"
                                              type="submit">Login</md-filled-button>
                        </form>
                    </div>
                </div>
            </li>
            <li th:if="${allowRegistration}" class="list-group-item p-3">
                <div class="row">
                    <div class="col-sm-12 col-md">
                        <p class="fw-bold d-block mb-2">Not registered?</p>
                        <md-outlined-button class="wt-btn-block" href="/register">Register</md-outlined-button>
                    </div>
                </div>
            </li>
        </ul>
    </div>
</main>
    <div th:replace="~{fragments/versionbadge}"></div>
    <script src="/scripts/login.js" th:attr="nonce=${nonce}"></script>
</body>
</html>
