name: CI

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify pinned source parsers
        run: |
          python -m pip install -r watchtower-core/src/main/resources/assistant/tree-sitter-requirements.txt
          python watchtower-core/src/test/python/test_source_outline.py
      - name: Install pinned Opengrep for real capability contracts
        run: |
          curl -fsSL -o "$RUNNER_TEMP/opengrep" https://github.com/opengrep/opengrep/releases/download/v1.30.2/opengrep_manylinux_x86
          echo "a66aa3278457f02b287b985a45b6762aebcaba5000f2689245fd1ed86d1456c7  $RUNNER_TEMP/opengrep" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/opengrep"
          echo "WATCHTOWER_OPENGREP_PATH=$RUNNER_TEMP/opengrep" >> "$GITHUB_ENV"
      - name: Test, enforce coverage, and require MySQL migrations
        run: ./mvnw --batch-mode --no-transfer-progress -Dwatchtower.mysql.required=true clean verify
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
            watchtower-core/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14
