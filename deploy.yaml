apiVersion: apps/v1
kind: Deployment
metadata:
  name: watchtower-deployment
  namespace: watchtower
  labels:
    app: watchtower
spec:
  replicas: 1
  selector:
    matchLabels:
      app: watchtower
  template:
    metadata:
      labels:
        app: watchtower
    spec:
      # Wires the pod to the ServiceAccount defined further down in this file, which
      # carries the eks.amazonaws.com/role-arn annotation IRSA needs for S3/SQS access
      # (Phases 3/4). Without this line the pod silently runs as the `default`
      # ServiceAccount and every AWS SDK call fails with a credentials error - see the
      # fail-closed check deploy.sh runs for this exact field before applying.
      serviceAccountName: watchtower-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: watchtower-container
        image: "!!!IMAGE_LOCATION!!!"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          # requests must be <= limits; these were inverted, which Kubernetes rejects.
          # Note deploy.sh reuses cpu/memory from the live deployment, so these values
          # only take effect on a cluster that has no Watchtower deployment yet.
          requests:
            cpu: "2"
            memory: "4Gi"
            # Scans extract repo archives to the node's disk. Uncapped, four concurrent
            # scans can exhaust node disk and evict unrelated pods with no warning.
            # ephemeral-storage is not reused by deploy.sh, so these do apply on every
            # deploy. Tune from `kubectl exec ... -- df -h /tmp` once observed.
            ephemeral-storage: "2Gi"
          limits:
            cpu: "6"
            memory: "12Gi"
            ephemeral-storage: "8Gi"
        ports:
        - containerPort: 7777
        startupProbe:
          httpGet:
            path: /login
            port: 7777
          failureThreshold: 60
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /login
            port: 7777
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /login
            port: 7777
          periodSeconds: 30
          failureThreshold: 3
        imagePullPolicy: Always
        env:
        - name: APP_VERSION
          value: "!!!APP_VERSION!!!"
        - name: SPRING_PROFILES_ACTIVE
          value: prd
        - name: SERVER_PORT
          value: '7777'
        # Actuator's management port (application.yaml: management.server.port, 8090) is
        # bound to 127.0.0.1 and deliberately not listed under ports. kubectl port-forward
        # deployment/watchtower-deployment 8090:8090 -n watchtower works regardless.
        - name: watchtower.runAfterStartup
          value: 'false'
        - name: watchtower.allowRegistration
          value: 'false'
        - name: watchtower.threads.prscan
          value: '4'
        - name: watchtower.threads.uploadscan
          value: '2'
        # S3/SQS values below come from AWS_PROVISIONING.md once that infra was
        # provisioned (bucket watchtower-source-cache, queue watchtower-scan-queue.fifo,
        # account 111122223333, region us-east-1). S3Service/SqsScanQueueService no-op
        # if bucket/queue-url are blank, so these are safe to carry even if provisioning
        # is ever rolled back.
        - name: watchtower.storage.s3.bucket
          value: 'watchtower-source-cache'
        - name: watchtower.storage.s3.region
          value: 'us-east-1'
        # Dev reference values. deploy.sh replaces these from .aws-security/<env>.json
        # generated by provision-aws.sh --aws-security-only; without it the feature is off.
        # An empty KMS key selects AES256. Scanning is controlled in Scanner modules.
        - name: WATCHTOWER_AWS_SECURITY_PR_ENFORCEMENT
          value: 'true'
        - name: WATCHTOWER_AWS_SECURITY_MAX_CONCURRENT_REVIEWS
          value: '2'
        - name: WATCHTOWER_AWS_SECURITY_FAILURE_POLICY
          value: 'UNDECIDED'
        - name: WATCHTOWER_AWS_SECURITY_ACCOUNT
          value: '111122223333'
        - name: WATCHTOWER_AWS_SECURITY_SERVICE_ROLE
          value: 'arn:aws:iam::111122223333:role/service-role/security-agent-service-role'
        - name: WATCHTOWER_AWS_SECURITY_INPUT_BUCKET
          value: 'watchtower-source-cache'
        - name: WATCHTOWER_AWS_SECURITY_KMS_KEY
          value: ''
        - name: watchtower.queue.sqs.queue-url
          value: 'https://sqs.us-east-1.amazonaws.com/111122223333/watchtower-scan-queue.fifo'
        - name: watchtower.queue.sqs.region
          value: 'us-east-1'
        - name: watchtower.queue.sqs.visibility-extension-seconds
          value: '300'
        # Repository Scan queue, created by scripts/provision-aws.sh (run it before deploying
        # this). Blank runs repository scans inside the pod, which is safe with one replica only.
        - name: watchtower.reposcan.queue-url
          value: 'https://sqs.us-east-1.amazonaws.com/111122223333/watchtower-reposcan.fifo'
        - name: WATCHTOWER_CLOUDWATCH_ENABLED
          value: 'true'
        - name: WATCHTOWER_CLOUDWATCH_NAMESPACE
          value: 'Watchtower/Runtime'
        - name: WATCHTOWER_CLOUDWATCH_REGION
          value: 'us-east-1'
        - name: WATCHTOWER_CLOUDWATCH_STEP
          value: '60s'
        - name: WATCHTOWER_METRICS_ZONE
          value: 'Asia/Kolkata'
        - name: TZ
          value: 'Asia/Kolkata'
        # Real feature flag (see FEATURE_ENV_VARS in deploy.sh) - reused from live on
        # redeploy, so it can be flipped off via kubectl without editing this file.
        # allowRegistration is intentionally not inherited: the checked-in secure
        # default must win rather than silently reopening registration.
        - name: watchtower.queue.sqs.submission-enabled
          value: 'true'
        # Watchtower's own externally reachable base url, used to build the callback url
        # for self-registered webhooks (see ApiIntegrationService). Deliberately NOT in
        # deploy.sh's FEATURE_ENV_VARS reuse-from-live list: it must always match this
        # environment's actual ingress host below, so deploy.sh derives it fresh from
        # INGRESS_HOST every deploy rather than inheriting whatever a prior deploy set.
        - name: watchtower.publicUrl
          value: 'https://watchtower.example.net'
        - name: JDBC_URL
          valueFrom:
            secretKeyRef:
              name: watchtower-secrets
              key: db_url
        - name: JDBC_USERNAME
          valueFrom:
            secretKeyRef:
              name: watchtower-secrets
              key: db_user
        - name: JDBC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: watchtower-secrets
              key: db_pass
        - name: WATCHTOWER_BOOTSTRAP_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: watchtower-secrets
              key: bootstrap_admin_password

---
## Watchtower Service ####
apiVersion: v1
kind: Service
metadata:
  name: watchtower-service
  labels:
    app: watchtower
  namespace: watchtower
spec:
  type: ClusterIP
  selector:
    app: watchtower
  ports:
    - name: watchtower
      port: 80 # <--- CHANGED: Common internal service port for HTTP/S traffic after TLS termination at ALB
      targetPort: 7777 # Your application still listens on 7777

---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: watchtower-sa
  namespace: watchtower
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/watchtower-scan-role


---
## Watchtower Ingress ####
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: watchtower-ingress
  namespace: watchtower
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    #    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    #    alb.ingress.kubernetes.io/actions.ssl-redirect: '{"Type": "redirect", "RedirectConfig": { "Protocol": "HTTPS", "Port": "443", "StatusCode": "HTTP_301"}}'
    alb.ingress.kubernetes.io/certificate-arn: "<Cert ARN, get it from old deployment or AWS>"
    alb.ingress.kubernetes.io/group.name: shared-apps-alb # This group name is used to group multiple apps to the same ALB, Should be same for Synapse as well.
    alb.ingress.kubernetes.io/tags: Environment=Prod,Group=SharedApps
    alb.ingress.kubernetes.io/healthcheck-path: /login
    # UI sessions live in each pod's memory, so with more than one replica a browser must keep
    # reaching the pod it logged in on. Applies to Watchtower's target group only.
    alb.ingress.kubernetes.io/target-group-attributes: stickiness.enabled=true,stickiness.type=lb_cookie,stickiness.lb_cookie.duration_seconds=28800
    alb.ingress.kubernetes.io/security-groups: "<Get Security group from AWS ex: sg-XXXXXX>" # this is watchtower-sg and it would be applied to ALB
    alb.ingress.kubernetes.io/manage-backend-security-group-rules: "true" # this flag manages sg between ALB and Actual Node where pod/service is present (should always be true to avoid manual config)


spec:
  ingressClassName: alb
  tls:
    - hosts:
        - watchtower.example.net
  rules:
    - host: watchtower.example.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: watchtower-service
                port:
                  number: 80
